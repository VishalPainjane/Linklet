services:
  postgres:
    image: postgres:17
    container_name: linklet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linklet}
      POSTGRES_USER: ${POSTGRES_USER:-linklet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linklet} -d ${POSTGRES_DB:-linklet}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - linklet_net

  redis:
    image: redis:7-alpine
    container_name: linklet_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - linklet_net

  rabbitmq:
    image: rabbitmq:4-management
    container_name: linklet_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - linklet_net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  linklet_net:
    driver: bridge
