services:
  # Linklet High-Performance FastAPI Backend
  - type: web
    name: linklet-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "alembic upgrade head && uvicorn linklet.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: linklet-db
          property: connectionString
      - key: ALLOWED_CORS_ORIGINS
        value: "*"
      - key: RUN_CLICK_CONSUMER
        value: "true"
      - key: RUN_OUTBOX_WORKER
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  # Free Managed PostgreSQL Database
  - name: linklet-db
    databaseName: linklet
    user: linklet
    plan: free
    region: oregon

